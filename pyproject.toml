[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper"
version = "0.1.0"
description = "A general-purpose web scraper and crawler"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
scraper = "scraper.cli:main"

[tool.setuptools]
packages = ["scraper"]
